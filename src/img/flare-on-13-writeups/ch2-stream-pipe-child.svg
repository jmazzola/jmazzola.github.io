<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="530" viewBox="0 0 1220 530" role="img" aria-labelledby="title desc">
<title id="title">Stream to pipe to child</title>
<desc id="desc">The 18-byte NTFS named stream passes through the parent's selector and process-age gates and a GUI XOR transform to become the 11-byte pipe key HarryPotter. Sol patched the parent gates to capture this key. The child uses an RC4 variant but its strlen stub returns 19 instead of 18.</desc>
<rect width="1220" height="530" rx="14" fill="#f7f9fc"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#1c2c41">
<text x="30" y="37" font-size="24" font-weight="700">Stream to pipe to child</text>
<text x="30" y="65" font-size="15">18 stream bytes become an 11-byte key for the child's 38-byte decode.</text>
<g stroke="#476484" stroke-width="3" fill="none"><path d="M280 166H336"/><path d="M560 166H616"/><path d="M832 166H886"/><path d="M1040 252V278H420V304"/><path d="M538 390H780"/></g>
<g fill="#e7eef9" stroke="#547296" stroke-width="2"><rect x="22" y="94" rx="9" width="258" height="158"/><rect x="336" y="94" rx="9" width="224" height="158"/><rect x="616" y="94" rx="9" width="216" height="158"/><rect x="886" y="94" rx="9" width="310" height="158"/><rect x="302" y="304" rx="9" width="236" height="170"/><rect x="780" y="304" rx="9" width="236" height="170"/></g>
<g font-size="17"><text x="39" y="125" font-weight="700">WIM → NTFS named stream</text><text x="39" y="155">PolyjuicePotion.txt:</text><text x="39" y="180">LordVoldemort</text><text x="39" y="208">18 bytes incl. space + CRLF</text><text x="352" y="125" font-weight="700">Parent: selector</text><text x="352" y="158">[0x140006668] == 1?</text><text x="352" y="187">VA 0x140001A8C</text><text x="352" y="218">Default: unnamed file</text><text x="633" y="125" font-weight="700">Parent: time gate</text><text x="633" y="158">Process age &gt; 10080</text><text x="633" y="186">minutes (7 days)</text><text x="633" y="216">VA 0x140001BAA</text><text x="903" y="125" font-weight="700">GUI transform</text><text x="903" y="158">previous message byte ⊕ 1</text><text x="903" y="188">then 15-byte XOR mask</text><text x="903" y="218">VA 0x140001B73-1C32</text><text x="319" y="338" font-weight="700">Named pipe</text><text x="319" y="367">\\.\pipe\FlareChallenge</text><text x="319" y="397">Key after patching gates:</text><text x="319" y="425" font-weight="700">HarryPotter (11 bytes)</text><text x="797" y="338" font-weight="700">Original child</text><text x="797" y="367">strlen stub returns 19</text><text x="797" y="397">C-string really has 18</text><text x="797" y="425">RC4-style 38-byte decode</text></g>
<text x="30" y="510" font-size="15">The child uses the length twice: to advance the RC4 state index and to add to each ciphertext byte.</text>
</g></svg>
